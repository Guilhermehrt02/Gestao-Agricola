<div class="flex justify-between items-center gap-2 mb-4">
  <lib-button
    *ngIf="showRefresh"
    [variant]="'text'"
    [severity]="'secondary'"
    [icon]="'pi pi-refresh'"
    (click)="onRefresh()"
  ></lib-button>

  <lib-input
    class="w-full max-w-64"
    [id]="'globalFilter'"
    [type]="'search'"
    [placeholder]="'Buscar...'"
    [fluid]="true"
    [maxlength]="50"
    [(ngModel)]="searchTerm"
  ></lib-input>
</div>

<p-dataview
  [value]="filteredData"
  [rows]="rows"
  [paginator]="paginator"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [lazy]="false"
>
  <ng-template let-items #list>
    <div class="grid grid-cols-12 gap-4">
      <div
        class="col-span-12 md:col-span-6 lg:col-span-4"
        *ngFor="let item of items"
      >
        <div
          class="border rounded-lg p-4 shadow-md bg-white dark:bg-surface-800 cursor-pointer transition hover:shadow-lg"
          tabindex="0"
          (click)="onSelect(item)"
          (keydown)="($event.key === 'Enter' || $event.key === ' ') && onSelect(item)"
        >
          <!-- Exemplo de exibição dos dados -->
          <h3 class="font-bold text-lg mb-2">{{ item.name }}</h3>
          <p class="text-sm text-gray-600">{{ item.description }}</p>
          <p class="text-sm mt-2">Status: {{ item.status }}</p>
        </div>
      </div>
    </div>
  </ng-template>

  <ng-template #emptymessage>
    <div class="text-center text-gray-400 p-6">
      Nenhum registro encontrado.
    </div>
  </ng-template>

  <ng-template #loading>
    <div class="grid grid-cols-12 gap-4">
      <div *ngFor="let i of [].constructor(rows)" class="col-span-12 md:col-span-6 lg:col-span-4">
        <p-skeleton height="150px"></p-skeleton>
      </div>
    </div>
  </ng-template>
</p-dataview>
