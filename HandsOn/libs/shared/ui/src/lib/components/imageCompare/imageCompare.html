<div class="card">
  <div class="card flex justify-center">
    <p-imagecompare class="shadow-lg rounded-2xl">
      <ng-template #left>
        <img [src]="images[0].itemImageSrc" title="images[0].title" alt="images[0].alt" />
      </ng-template>
      <ng-template #right>
        <img [src]="images[1].itemImageSrc" title="images[1].title" alt="images[1].alt" />
      </ng-template>
    </p-imagecompare>
  </div>
</div>
