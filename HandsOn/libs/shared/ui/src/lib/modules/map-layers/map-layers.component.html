<!-- eslint-disable @angular-eslint/template/elements-content -->
<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->

<div
  class="p-4 bg-gray-900 border border-green-700 rounded-md shadow-md space-y-4 mb-4"
>
  <!-- Cabeçalho -->
  <div class="flex justify-between items-center">
    <h2 class="text-lg font-semibold text-green-400">Camadas do mapa</h2>

    <button
      class="ml-4 px-4 py-2 border rounded font-medium flex items-center gap-2 transition"
      [ngClass]="{
        'bg-green-900 text-white border-blue-500': showLayerList,
        'bg-gray-700 text-white border-gray-600': !showLayerList
      }"
      (click)="toggleLayerList()"
    >
      <i class="pi pi-angle-down"></i>
    </button>
  </div>

  <!-- Lista de camadas -->
  <ul class="space-y-3" *ngIf="showLayerList">
    <li
      *ngFor="let layer of layers"
      class="border border-gray-700 rounded-md p-2"
    >
      <div class="flex justify-between items-center">
        <div class="flex items-center space-x-2">
              <p-checkbox
                [(ngModel)]="layer.visible"
                binary="true"
                inputId="{{ layer.label }}"
                (onChange)="onToggle(layer)"
              >
              </p-checkbox>

              <span
                class="text-gray-300 cursor-pointer hover:text-green-400 transition"
                [ngClass]="{
                  'cursor-not-allowed opacity-50': !layer.data?.hasShapes
                }"
                [title]="
                  layer.data?.hasShapes
                    ? 'Focar no mapa'
                    : 'Sem desenho disponível'
                "
                (click)="layer.data?.hasShapes ? onFocus(layer) : null"
              >
                {{ layer.data?.info?.totalArea 
                  ? `${layer.label} (${layer.data.info.totalArea.toFixed(2)} ha)` 
                  : layer.label }}

              </span>
            </div>

            <div class="flex items-center space-x-1">
              <button
                *ngIf="layer.data?.hasShapes"
                pButton
                [icon]="layer.data.hideShapeOnly ? 'pi pi-eye-slash' : 'pi pi-eye'"
                class="p-button-rounded p-button-text p-button-sm text-white"
                title="Mostrar/ocultar apenas o desenho da fazenda"
                (click)="onToggleOnlyFarmOrPlotShape(layer)"
              ></button>
              <!-- Mostrar botão de criar se não tiver shape -->
              <button
                *ngIf="
                  !layer.data?.hasShapes
                "
                pButton
                icon="pi pi-plus"
                class="p-button-rounded p-button-text p-button-sm text-white"
                title="Criar desenho"
                (click)="onCreateShape(layer.data.info.id, 'farm')"
              ></button>

              <button
                *ngIf="
                  layer.data?.hasShapes
                "
                pButton
                icon="pi pi-pencil"
                class="p-button-rounded p-button-text p-button-sm text-white"
                title="Editar desenho"
                (click)="onEditShape(layer.data.info.id)"
              ></button>
            </div>
      </div>

      <!-- Subcamadas -->
      <ul
        *ngIf="layer.children?.length"
        class="ml-4 mt-2 space-y-2 border-l border-gray-700 pl-3"
      >
        <li *ngFor="let sub of layer.children">
          <div class="flex justify-between items-center">
            <div class="flex items-center space-x-2">
              <p-checkbox
                [(ngModel)]="sub.visible"
                binary="true"
                inputId="{{ sub.label }}"
                (onChange)="onToggle(sub)"
              >
              </p-checkbox>

              <span
                class="text-gray-300 cursor-pointer hover:text-green-400 transition"
                [ngClass]="{
                  'cursor-not-allowed opacity-50': !sub.data?.hasShapes
                }"
                [title]="
                  sub.data?.hasShapes
                    ? 'Focar no mapa'
                    : 'Sem desenho disponível'
                "
                (click)="sub.data?.hasShapes ? onFocus(sub) : null"
              >
                {{ sub.data?.info?.totalArea 
                  ? `${sub.label} (${sub.data.info.totalArea.toFixed(2)} ha)` 
                  : sub.label }}

              </span>
            </div>

            <div class="flex items-center space-x-1">
              <button
                *ngIf="sub.data?.hasShapes"
                pButton
                [icon]="sub.data.hideShapeOnly ? 'pi pi-eye-slash' : 'pi pi-eye'"
                class="p-button-rounded p-button-text p-button-sm text-white"
                title="Mostrar/ocultar apenas o desenho do talhão"
                (click)="onToggleOnlyFarmOrPlotShape(sub)"
              ></button>

              <button
                *ngIf="
                  !sub.data?.hasShapes
                "
                pButton
                icon="pi pi-plus"
                class="p-button-rounded p-button-text p-button-sm text-white"
                title="Criar desenho"
                (click)="onCreateShape(sub.data.info.id, 'plot')"
              ></button>

              <button
                *ngIf="
                  sub.data?.hasShapes
                "
                pButton
                icon="pi pi-pencil"
                class="p-button-rounded p-button-text p-button-sm text-white"
                title="Editar desenho"
                (click)="onEditShape(sub.data.info.id)"
              ></button>
            </div>
          </div>

          <!-- Sub-subcamadas -->
          <ul
            *ngIf="sub.children?.length"
            class="ml-4 mt-1 space-y-1 border-l border-gray-700 pl-3"
          >
            <li *ngFor="let child of sub.children">
              <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                  <!-- Ícone do tipo (MOSTRAR SÓ SE hasShapes = true) -->
                  <span *ngIf="child.data?.hasShapes">
                    <img
                      *ngIf="child.data?.type === 'polygon'"
                      src="https://mt.googleapis.com/vt/icon/name=icons/onion/1492-wht-polygon-blank.png&filter=ffC2185B"
                      class="w-4 h-4 object-contain opacity-80"
                    />

                    <img
                      *ngIf="child.data?.type === 'marker'"
                      src="https://maps.gstatic.com/mapfiles/ms2/micons/red-dot.png"
                      class="w-4 h-4 object-contain opacity-80"
                    />
                  </span>


                  <label
                    class="text-gray-400 text-sm cursor-pointer hover:text-green-200 transition"
                    (click)="onFocus(child)"
                    title="Focar no mapa">
                    {{ child.label }}
                  </label>
                </div>

                  <div class="flex items-center space-x-1">
                    <button
                      *ngIf="
                        child.data?.hasShapes === false
                      "
                      pButton
                      icon="pi pi-plus"
                      class="p-button-rounded p-button-text p-button-sm text-white"
                      title="Criar desenho"
                      (click)="onCreateShape(child.data.info.id, 'diagnosis')"
                    ></button>
                      <button
                        *ngIf="
                          child.data?.hasShapes
                        "
                        pButton
                        icon="pi pi-pencil"
                        class="p-button-rounded p-button-text p-button-sm text-white"
                        title="Editar desenho"
                        (click)="onEditShape(child.data.id)"
                      ></button>
                  </div>
              </div>
            </li>
          </ul>
        </li>
      </ul>
    </li>
  </ul>
</div>
