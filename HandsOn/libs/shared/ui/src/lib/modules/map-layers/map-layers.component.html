<!-- eslint-disable @angular-eslint/template/elements-content -->
<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
<div
  class="p-4 bg-gray-900 border border-green-700 rounded-md shadow-md space-y-4 mb-4"
>
  <!-- Cabeçalho -->
  <div class="flex justify-between items-center">
    <h2 class="text-lg font-semibold text-green-400">Camadas do mapa</h2>

    <button
      class="ml-4 px-4 py-2 border rounded font-medium flex items-center gap-2 transition"
      [ngClass]="{
        'bg-green-900 text-white border-blue-500': showLayerList,
        'bg-gray-700 text-white border-gray-600': !showLayerList
      }"
      (click)="toggleLayerList()"
    >
      <i class="pi pi-angle-down"></i>
    </button>
  </div>

  <!-- Lista de camadas -->
  <ul class="space-y-3" *ngIf="showLayerList">
    <li
      *ngFor="let layer of layers"
      class="border border-gray-700 rounded-md p-2"
    >
      <div class="flex justify-between items-center">
        <div class="flex items-center space-x-2">
              <p-checkbox
                [(ngModel)]="layer.visible"
                [disabled]="!layer.data || !layer.data.hasShapes"
                (click)="onToggle(layer)"
              >
              </p-checkbox>

              <span
                class="text-gray-300 cursor-pointer hover:text-green-400 transition"
                [ngClass]="{
                  'cursor-not-allowed opacity-50': !layer.data?.hasShapes
                }"
                [title]="
                  layer.data?.hasShapes
                    ? 'Focar no mapa'
                    : 'Sem desenho disponível'
                "
                (click)="layer.data?.hasShapes ? onFocus(layer) : null"
              >
                {{ layer.label }}
              </span>
            </div>

            <div class="flex items-center space-x-1">
              <!-- Mostrar botão de criar se não tiver shape -->
              <button
                *ngIf="
                  !layer.data?.hasShapes &&
                  (layer.class === 'farm' || layer.class === 'plot')
                "
                pButton
                icon="pi pi-pencil"
                class="p-button-rounded p-button-text p-button-sm text-white"
                title="Criar desenho"
                (click)="onCreateShape()"
              ></button>
            </div>
      </div>

      <!-- Subcamadas -->
      <ul
        *ngIf="layer.children?.length"
        class="ml-4 mt-2 space-y-2 border-l border-gray-700 pl-3"
      >
        <li *ngFor="let sub of layer.children">
          <div class="flex justify-between items-center">
            <div class="flex items-center space-x-2">
              <p-checkbox
                [(ngModel)]="sub.visible"
                [disabled]="!sub.data?.hasShapes"
                (click)="onToggle(sub)"
              >
              </p-checkbox>

              <span
                class="text-gray-300 cursor-pointer hover:text-green-400 transition"
                [ngClass]="{
                  'cursor-not-allowed opacity-50': !sub.data?.hasShapes
                }"
                [title]="
                  sub.data?.hasShapes
                    ? 'Focar no mapa'
                    : 'Sem desenho disponível'
                "
                (click)="sub.data?.hasShapes ? onFocus(sub) : null"
              >
                {{ sub.label }}
              </span>
            </div>

            <div class="flex items-center space-x-1">
              <!-- Mostrar botão de criar se não tiver shape -->
              <button
                *ngIf="
                  !sub.data?.hasShapes &&
                  (sub.class === 'farm' || sub.class === 'plot')
                "
                pButton
                icon="pi pi-pencil"
                class="p-button-rounded p-button-text p-button-sm text-white"
                title="Criar desenho"
                (click)="onCreateShape()"
              ></button>
            </div>
          </div>

          <!-- Sub-subcamadas -->
          <ul
            *ngIf="sub.children?.length"
            class="ml-4 mt-1 space-y-1 border-l border-gray-700 pl-3"
          >
            <li *ngFor="let child of sub.children">
              <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                  <p-checkbox
                    [(ngModel)]="child.visible"
                    binary="true"
                    inputId="{{ child.label }}"
                    (onChange)="onToggle(child)"
                  >
                  </p-checkbox>

                  <label
                    class="text-gray-400 text-sm cursor-pointer hover:text-green-200 transition"
                    (click)="onFocus(child)"
                    title="Focar no mapa">
                    {{ child.label }}
                  </label>
                </div>
              </div>
            </li>
          </ul>
        </li>
      </ul>
    </li>
  </ul>
</div>
