<div
  class="p-4 bg-gray-900 border border-green-700 rounded-md shadow-md space-y-4 mb-4"
>
  <div class="flex flex-wrap items-center justify-between w-full">
    <h2 class="text-lg font-semibold text-green-400 mb-2">Filtros do Mapa</h2>

    <button
      class="ml-4 px-4 py-2 border rounded font-medium flex items-center gap-2 transition"
      [ngClass]="{
        'bg-green-900 text-white border-blue-500': showCustomPicker,
        'bg-gray-700 text-white border-gray-600': !showCustomPicker
      }"
      (click)="toggleCustomPicker()"
    >
      <i class="pi pi-angle-down"></i>
    </button>
  </div>

  <form
    *ngIf="showCustomPicker"
    [formGroup]="form"
    class="space-y-4"
    (ngSubmit)="onFilterChange()"
  >
    <div class="flex flex-wrap gap-2">
      <lib-select
        [options]="farms"
        placeholder="Filtrar por fazenda"
        [control]="farm"
        [multiple]="true"
        class="flex-1"
      ></lib-select>

      <lib-select
        [options]="plots"
        placeholder="Filtrar por talhão"
        [control]="plot"
        [multiple]="true"
        class="flex-1"
      ></lib-select>
    </div>

    <div class="flex flex-wrap gap-2">
      <lib-select
        [options]="harvests"
        placeholder="Filtrar por colheita"
        [control]="harvest"
        [multiple]="true"
        class="flex-1"
      ></lib-select>

      <lib-select
        [options]="problems"
        placeholder="Filtrar por problema"
        [control]="problem"
        [multiple]="true"
        class="flex-1"
      ></lib-select>
    </div>

    <div class="flex flex-wrap gap-2">
      <lib-select
        [options]="cultures"
        placeholder="Filtrar por cultivo"
        [control]="culture"
        [multiple]="true"
        class="flex-1"
      ></lib-select>

      <lib-select
        [options]="statusOptions"
        placeholder="Filtrar por status"
        [control]="status"
        [multiple]="true"
        class="flex-1"
      ></lib-select>
    </div>

    <div class="flex flex-wrap gap-2 items-end">
      <lib-input
        [label]="'Data Inicial'"
        [type]="'date'"
        [control]="startDate"
        class="flex-1"
      ></lib-input>

      <lib-input
        [label]="'Data Final'"
        [type]="'date'"
        [control]="endDate"
        class="flex-1"
      ></lib-input>
    </div>

    <div class="text-right">
      <lib-button
        label="Aplicar filtros"
        [disabled]="form.invalid"
        type="submit"
      ></lib-button>
    </div>
  </form>
</div>
