<div
  class="p-4 bg-gray-900 border border-green-700 rounded-md shadow-md space-y-4 mb-4"
>
  <h2 class="text-lg font-semibold text-green-400 mb-2">
    Filtros do Mapa
  </h2>

  <form [formGroup]="form" class="space-y-4">

    <div class="flex flex-wrap gap-2">
      <lib-select
        [options]="farms"
        placeholder="Filtrar por fazenda"
        formControlName="farm"
        [multiple]="true"
        class="flex-1"
      ></lib-select>

      <lib-select
        [options]="plots"
        placeholder="Filtrar por talhão"
        formControlName="plot"
        [multiple]="true"
        class="flex-1"
      ></lib-select>
    </div>

    <div class="flex flex-wrap gap-2">
      <lib-select
        [options]="harvests"
        placeholder="Filtrar por colheita"
        formControlName="harvest"
        [multiple]="true"
        class="flex-1"
      ></lib-select>

      <lib-select
        [options]="problems"
        placeholder="Filtrar por problema"
        formControlName="problem"
        [multiple]="true"
        class="flex-1"
      ></lib-select>
    </div>
    
    <div class="flex flex-wrap gap-2">
      <lib-select
        [options]="cultures"
        placeholder="Filtrar por cultivo"
        formControlName="culture"
        [multiple]="true"
        class="flex-1"
      ></lib-select>

      <lib-select
        [options]="status"
        placeholder="Filtrar por status"
        formControlName="status"
        [multiple]="true"
        class="flex-1"
      ></lib-select>
    </div>

    <div class="flex flex-wrap gap-2 items-end">
      <lib-input
        [label]="'Data Inicial'"
        [type]="'date'"
        formControlName="startDate"
        class="flex-1"
      ></lib-input>

      <lib-input
        [label]="'Data Final'"
        [type]="'date'"
        formControlName="endDate"
        class="flex-1"
      ></lib-input>
    </div>

    <div class="text-right">
      <lib-button
        label="Aplicar filtros"
        [disabled]="form.invalid"
        (click)="getFilterValues()"
      ></lib-button>
    </div>
  </form>
</div>
