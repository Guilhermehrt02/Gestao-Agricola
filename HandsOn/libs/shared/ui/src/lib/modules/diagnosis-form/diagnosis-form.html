<form
  [formGroup]="diagnosisForm"
  (ngSubmit)="onSubmit()"
  class="w-full flex flex-col gap-2 mt-6"
>
  <div class="w-full max-w-md mx-auto flex flex-col gap-2">
    <lib-select
      [id]="'farmId'"
      [label]="'Propriedade'"
      [placeholder]="'Selecione uma propriedade'"
      [required]="true"
      [fluid]="true"
      [control]="farmId"
      [options]="farmOptions"
      [filter]="true"
      class="w-full"
    />

    <lib-select
      [id]="'harvestId'"
      [label]="'Safra'"
      [placeholder]="'Selecione uma safra'"
      [required]="true"
      [fluid]="true"
      [control]="harvestId"
      [options]="harvestOptions"
      [filter]="true"
      [disabled]="!harvests?.length"
      class="w-full"
    />

    <lib-select
      [id]="'plotId'"
      [label]="'Talhão'"
      [placeholder]="'Selecione um talhão'"
      [required]="true"
      [fluid]="true"
      [control]="plotId"
      [options]="plotOptions"
      [filter]="true"
      [disabled]="!plots?.length"
      class="w-full"
    />

    <lib-input
      [id]="'date'"
      [label]="'Data'"
      [placeholder]="'31/03/2025'"
      [type]="'date'"
      [control]="date"
      class="w-full"
    />

    <lib-select
      [id]="'uploadType'"
      [label]="'Tipo de Diagnóstico'"
      [placeholder]="'Selecione um tipo de diagnóstico'"
      [required]="true"
      [fluid]="true"
      [control]="uploadType"
      [options]="uploadTypeOptions"
      [filter]="true"
      class="w-full"
    ></lib-select>

    <lib-input
      [id]="'photoFile'"
      [label]="'Foto (Arquivo)'"
      [type]="'file'"
      (fileSelected)="onFileSelected($event)"
      class="w-full"
    />

    <lib-get-location
      (locationDetected)="onLocationDetected($event)"
    ></lib-get-location>

    <lib-button
      class="w-full max-w-96 mt-6 mx-auto"
      [label]="submitLabel"
      [type]="'submit'"
      [fluid]="true"
      [severity]="'primary'"
      [loading]="loading"
    ></lib-button>
  </div>
</form>
