<form
  [formGroup]="diagnosisForm"
  (ngSubmit)="onSubmit()"
  class="w-full flex flex-col gap-2 mt-6"
>
  <div class="w-full max-w-md mx-auto flex flex-col gap-2">
    <lib-select
      [id]="'farm'"
      [label]="'Propriedade'"
      [placeholder]="'Selecione uma propriedade'"
      [required]="true"
      [fluid]="true"
      [control]="farm"
      [options]="farmOptions"
      [filter]="true"
      class="w-full"
    />

    <lib-select
      [id]="'harvest'"
      [label]="'Safra'"
      [placeholder]="'Selecione uma safra'"
      [required]="true"
      [fluid]="true"
      [control]="harvest"
      [options]="harvestOptions"
      [filter]="true"
      [disabled]="!harvests?.length"
      class="w-full"
    />

    <lib-select
      [id]="'plot'"
      [label]="'Talhão'"
      [placeholder]="'Selecione um talhão'"
      [required]="true"
      [fluid]="true"
      [control]="plot"
      [options]="plotOptions"
      [filter]="true"
      [disabled]="!plots?.length"
      class="w-full"
    />

    <lib-input
      [id]="'date'"
      [label]="'Data'"
      [placeholder]="'31/03/2025'"
      [type]="'date'"
      [control]="date"
      class="w-full"
    />

    <lib-select
      [id]="'uploadType'"
      [label]="'Tipo de Diagnóstico'"
      [placeholder]="'Selecione um tipo de diagnóstico'"
      [required]="true"
      [fluid]="true"
      [control]="uploadType"
      [options]="uploadTypeOptions"
      [filter]="true"
      class="w-full"
    ></lib-select>

    <lib-input
      [id]="'photoFile'"
      [label]="'Foto (Arquivo)'"
      [type]="'file'"
      (fileSelected)="onFileSelected($event)"
      class="w-full"
    />
    <lib-input
      formControlName="latitude"
      label="Latitude"
      [type]="'number'"
    ></lib-input>

    <lib-input
      formControlName="longitude"
      label="Longitude"
      [type]="'number'"
    ></lib-input>
    
    <lib-button
      label="Marcar no mapa"
      (click)="markFromFields()"
    ></lib-button>

    <lib-get-location
      #locationComp
      [setPositionFromParent]="{ 
        latitude: diagnosisForm.get('latitude')?.value, 
        longitude: diagnosisForm.get('longitude')?.value 
      }"
      [setShapesFromParent]="drawingShape"
      (locationDetected)="onLocationDetected($event)"
      (shapesDrawn)="onShapesDrawn($event)"
    ></lib-get-location>

    <lib-button
      class="w-full max-w-96 mt-6 mx-auto"
      [label]="submitLabel"
      [type]="'submit'"
      [fluid]="true"
      [severity]="'primary'"
      [loading]="loading"
    ></lib-button>
  </div>
</form>
