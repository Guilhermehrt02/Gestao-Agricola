<div class="p-6">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold">Meus Diagnósticos</h2>
    <lib-button
      [label]="'Novo Diagnóstico'"
      [severity]="'primary'"
      [type]="'button'"
      [styleClass]="'bg-green-800 text-white hover:bg-green-700 border-white'"
      (click)="onCreate()"
    ></lib-button>
  </div>

  <p-dataView
    #dv
    [value]="data"
    [rows]="5"
    [paginator]="true"
    layout="list"
    [loading]="loading"
  >
   <ng-template #list let-items>
    <div class="grid grid-cols-12 gap-4 grid-nogutter">
      <div class="col-span-12" *ngFor="let item of items; let first = first">
        <div
          class="flex flex-col sm:flex-row sm:items-center p-6 gap-4"
          [ngClass]="{ 'border-t border-surface-200 dark:border-surface-700': !first }"
        >
          <!-- IMAGEM -->
          <div class="w-32 h-32 flex-shrink-0">
            <img
              *ngIf="item.photoUrl; else noImage"
              [src]="item.photoUrl"
              alt="Diagnóstico"
              class="w-full h-full object-cover rounded-lg shadow-md"
            />
            <ng-template #noImage>
              <div class="w-full h-full flex items-center justify-center bg-gray-200 rounded-lg">
                <i class="pi pi-image text-gray-500 text-2xl"></i>
              </div>
            </ng-template>
          </div>

          <!-- INFO -->
          <div class="flex flex-col md:flex-row justify-between md:items-center flex-1 gap-6">
            <div class="flex flex-col gap-2">
              <span class="font-medium text-secondary text-sm">
                Fazenda: {{ item.farm.name }}
              </span>
              <div class="text-lg font-medium text-surface-900 dark:text-surface-0">
                Safra: {{ item.harvest.name }}
              </div>
              <div class="text-sm text-surface-500">Talhão: {{ item.plot.name }}</div>
            </div>

            <div class="flex flex-col gap-2 items-end">
              <!-- bloco de data e status -->
              <div class="flex flex-col items-start gap-1">
                <span class="text-sm text-gray-500">
                  {{ item.date | date: 'dd/MM/yyyy' }}
                </span>
                <span
                  class="text-base font-semibold"
                  [ngClass]="{
                    'text-green-600': item.status === 'Processed',
                    'text-yellow-600': item.status === 'Pending',
                    'text-red-600': item.status === 'Error'
                  }"
                >
                  {{ item.status }}
                </span>
              </div>

              <!-- Ações -->
              <div class="flex flex-row gap-2">
                <p-button
                  icon="pi pi-eye"
                  class="p-button-rounded p-button-success"
                  (onClick)="onView(item)"
                ></p-button>

                <p-button
                  icon="pi pi-pencil"
                  class="p-button-rounded p-button-outlined"
                  (onClick)="onEdit(item)"
                ></p-button>

                <p-button
                  icon="pi pi-trash"
                  class="p-button-rounded p-button-danger"
                  (onClick)="onDelete(item)"
                ></p-button>
              </div>


            </div>


          </div>
        </div>
      </div>
    </div>
  </ng-template>


  </p-dataView>

  <p *ngIf="!data?.length && !loading">Nenhum diagnóstico encontrado.</p>
</div>
