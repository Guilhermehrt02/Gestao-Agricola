<div class="p-6">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold">Meus Diagnósticos</h2>
    <lib-button
      [label]="'Novo Diagnóstico'"
      [severity]="'primary'"
      [type]="'button'"
      [styleClass]="'bg-green-800 text-white hover:bg-green-700 border-white'"
      (click)="onCreate()"
    ></lib-button>
  </div>

  <p-dataView
    #dv
    [value]="data"
    [rows]="5"
    [paginator]="true"
    layout="list"
    [loading]="loading"
  >
    <ng-template #list let-items>
  <div class="grid grid-cols-12 gap-4 grid-nogutter">
    <div class="col-span-12" *ngFor="let item of items; let first = first">
      <div
        class="flex flex-col sm:flex-row sm:items-center p-6 gap-4"
        [ngClass]="{ 'border-t border-surface-200 dark:border-surface-700': !first }"
      >
        <div class="flex flex-col md:flex-row justify-between md:items-center flex-1 gap-6">
          
          <!-- Informações principais -->
          <div class="flex flex-row md:flex-col justify-between items-start gap-2">
            <div>
              <span class="font-medium text-secondary text-sm">
                Fazenda: {{ item.farm.name }}
              </span>
              <div class="text-lg font-medium text-surface-900 dark:text-surface-0 mt-2">
                Safra: {{ item.harvest.name }}
              </div>
              <div class="text-sm text-surface-500">
                Talhão: {{ item.plot.name }}
              </div>
              <!-- <div class="text-sm text-surface-500">
                Data: {{ item.date | date: 'dd/MM/yyyy' }}
              </div> -->
            </div>
            <!-- <div class="bg-surface-100 dark:bg-surface-700 p-1 rounded-full">
              <div
                class="bg-surface-0 dark:bg-surface-900 flex items-center gap-2 justify-center py-1 px-2 rounded-full shadow-sm"
              >
                <span class="text-surface-900 dark:text-surface-0 font-medium text-sm">
                  Status: {{ item.status }}
                </span>
              </div>
            </div> -->
          </div>

          <!-- Ações -->
          <div class="flex flex-col md:items-end gap-4">
            
            <span class="text-sm text-gray-500">
              {{ item.date | date: 'dd/MM/yyyy' }}
            </span>
            <span
              class="text-base font-semibold"
              [ngClass]="{
                'text-green-600': item.status === 'Processed',
                'text-yellow-600': item.status === 'Pending',
                'text-red-600': item.status === 'Error'
              }"
                >
                {{ item.status }}
            </span>
            <!-- Botão Editar sempre disponível -->
            <p-button
              icon="pi pi-pencil"
              class="p-button-outlined"
              (onClick)="onEdit(item)"
            ></p-button>
            
            <div class="flex flex-row gap-2">
              <!-- Botão Visualizar só se status = Processed -->
              <p-button
                *ngIf="item.status === 'Processed'"
                icon="pi pi-eye"
                class="p-button-success"
                (onClick)="onView(item)"
              ></p-button>

              <p-button
                icon="pi pi-trash"
                class="p-button-danger"
                (onClick)="onDelete(item)"
              ></p-button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</ng-template>

  </p-dataView>

  <p *ngIf="!data?.length && !loading">Nenhum diagnóstico encontrado.</p>
</div>
