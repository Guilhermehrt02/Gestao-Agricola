<lib-card>
    <h2 class="text-xl text-center font-semibold mb-4">Mapa das propriedades</h2>
    <button
        class="flex justify-end gap-2 px-3 py-2 bg-gray-900 text-white rounded shadow"
        (click)="sidebarOpen = !sidebarOpen"
    >
        <i class="pi pi-list"></i>
        <span>Gerenciar mapa</span>
    </button>
    <p-sidebar 
        #sidebarRef [(visible)]="sidebarOpen" 
        position="left"
    >
        <ng-template pTemplate="headless">
            <lib-map-layers
                (editShape)="onEditShape($event)"
                (deleteShape)="onDeleteShape($event)"
                (createShape)="onCreateShape($event.id, $event.classType)"
            ></lib-map-layers>
        </ng-template>
    </p-sidebar>


    <div class="flex justify-end gap-4 my-3"
            *ngIf="editingElementId$ | async as editingId">
        <button
            class="px-4 py-2 bg-blue-600 text-white rounded"
            (click)="onSaveEditing()">
            Salvar
        </button>

        <button
            class="px-4 py-2 bg-gray-500 text-white rounded"
            (click)="onCancel()">
            Cancelar
        </button>
    </div>

    <div class="flex justify-end gap-4 my-3"
            *ngIf="creatingShape$ | async as creatingId">

        <button
            class="px-4 py-2 bg-gray-500 text-white rounded"
            (click)="onCancelCreate()">
            Cancelar
        </button>
    </div>

    <lib-map-component
        #mapContainer
        [editingElementId]="editingElementId$ | async"
        [creatingShape]="creatingShape$ | async"
        (shapeChanged)="onShapeEdited($event)"
        (editElement)="openEditPopup($event)"
    ></lib-map-component>
</lib-card>
