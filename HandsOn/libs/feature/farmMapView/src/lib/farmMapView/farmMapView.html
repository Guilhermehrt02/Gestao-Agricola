<lib-card>
    <h2 class="text-xl text-center font-semibold mb-4">Mapa das propriedades</h2>
    <lib-date-type-filter
        [diagnoses]="data"
        (locationShapesFiltered)="onLocationShapesFiltered($event)"
    ></lib-date-type-filter>

    <lib-map-layers
        [rawLayers]="locationShapes"
        (toggleVisibility)="onToggleLayer($event)"
        (focusLayer)="onFocusLayer($event)">
    </lib-map-layers>

    <lib-get-location
        #mapContainer
        [editable]="editable"
        [clearAllDrawings]="false"
        [setShapesFromParent]="locationShapes"
        [setFocusFromParent]="focusedLocationShape"
    ></lib-get-location>
</lib-card>
