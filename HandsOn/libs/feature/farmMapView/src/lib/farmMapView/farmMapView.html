<lib-card>
    <h2 class="text-xl text-center font-semibold mb-4">Mapa das propriedades</h2>
    <!-- <lib-date-type-filter
        [diagnoses]="data"
        (locationShapesFiltered)="onLocationShapesFiltered($event)"
    ></lib-date-type-filter> -->

    <lib-map-layers
        [rawLayers]="locationShapes"
        (toggleVisibility)="onToggleLayer($event)"
        (focusLayer)="onFocusLayer($event)"
        (createShape)="onCreateShape($event.type, $event.data)"
        (editShape)="onEditShape($event.type, $event.data)"
        (toggleOnlyFarmShape)="onToggleOnlyFarmShape($event)"
        (toggleOnlyPlotShape)="onToggleOnlyPlotShape($event)"
    ></lib-map-layers>

    <lib-map-component
        #mapContainer
        [editable]="editable"
        [creatable]="creatable"
        [createTarget]="createTarget"
        [clearAllDrawings]="false"
        [setShapesFromParent]="locationShapes"
        [setFocusFromParent]="focusedLocationShape"
        (setFocusByDrawing)="onSetFocusByDrawing($event)"
        (shapeCreated)="onShapeCreated($event)"
    ></lib-map-component>
</lib-card>
